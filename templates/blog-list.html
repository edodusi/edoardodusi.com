<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>Blog — Edoardo Dusi</title>
  <meta name="description" content="Thoughts, articles, and notes by Edoardo Dusi." />
  <link rel="canonical" href="https://edoardodusi.com/blog/" />
  <meta name="view-transition" content="same-origin" />
  
  <meta name="theme-color" content="#faf9f7" media="(prefers-color-scheme: light)" />
  <meta name="theme-color" content="#121314" media="(prefers-color-scheme: dark)" />

  <link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'%3E%3Crect width='100' height='100' rx='20' fill='%230f766e'/%3E%3Ctext x='50' y='68' font-size='52' font-family='Georgia,serif' font-style='italic' fill='white' text-anchor='middle'%3Ee%3C/text%3E%3C/svg%3E" />
  <link rel="alternate" type="application/rss+xml" title="Edoardo Dusi's Blog RSS Feed" href="https://edoardodusi.com/blog/rss.xml" />

  <script>
    (function () {
      var stored = new URLSearchParams(location.search).get('theme') || localStorage.getItem('theme');
      var dark = stored ? stored === 'dark' : matchMedia('(prefers-color-scheme: dark)').matches;
      document.documentElement.dataset.theme = dark ? 'dark' : 'light';
    })();
  </script>
  <link rel="stylesheet" href="/main.css?v2" />
  <style>
    .rss-link:hover .rss-icon {
      transform: scale(1.15) rotate(5deg);
    }
    
    .hero h1 {
      font-family: Georgia, "Times New Roman", serif;
      font-weight: 400;
      font-size: clamp(3.5rem, 10vw, 5.5rem);
      letter-spacing: -0.02em;
      margin-bottom: 1.25rem;
      line-height: 1.05;
      padding-bottom: 0.15em; /* Applied to both modes to prevent layout shift */
      color: var(--accent);
      display: block;
      width: fit-content;
    }

    :root[data-theme="dark"] .hero h1 {
      background: linear-gradient(135deg, var(--accent) 0%, #f26522 100%);
      -webkit-background-clip: text;
      -webkit-text-fill-color: transparent;
      background-clip: text;
    }
  </style>
</head>
<body>
  <header class="site-head">
    <nav class="site-nav" aria-label="Sections">
      <a class="brand" href="/">edo</a>
      <div id="nav-links" class="nav-links">
        <a href="/#work">Work</a>
        <a href="/#podcast">Podcast</a>
        <a href="/#speaking">Speaking</a>
        <a href="/#writing">Writing</a>
        <a href="/#guests">Guest</a>
        <a href="/#projects">Side</a>
      </div>
      <button id="nav-toggle" class="nav-toggle" type="button" aria-label="Open menu" aria-expanded="false" aria-controls="nav-links">
        <svg viewBox="0 0 24 24" width="20" height="20" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" aria-hidden="true">
          <line class="bar bar-1" x1="4" y1="6" x2="20" y2="6"/>
          <line class="bar bar-2" x1="4" y1="12" x2="20" y2="12"/>
          <line class="bar bar-3" x1="4" y1="18" x2="20" y2="18"/>
        </svg>
      </button>
      <button id="theme-toggle" class="theme-toggle" type="button" aria-label="Switch color theme">
        <svg class="icon-sun" viewBox="0 0 24 24" width="18" height="18" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" aria-hidden="true">
          <circle cx="12" cy="12" r="4"/><path d="M12 2v2m0 16v2M4.9 4.9l1.4 1.4m11.4 11.4 1.4 1.4M2 12h2m16 0h2M4.9 19.1l1.4-1.4M17.7 6.3l1.4-1.4"/>
        </svg>
        <svg class="icon-moon" viewBox="0 0 24 24" width="18" height="18" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">
          <path d="M21 12.8A9 9 0 1 1 11.2 3a7 7 0 0 0 9.8 9.8Z"/>
        </svg>
      </button>
    </nav>
  </header>

  <main id="top">
    <section class="hero reveal">
      <h1>Blog</h1>
      <p class="tagline">Unfiltered thoughts on the web, cloud, AI, coding and the developer ecosystem.</p>
      <div>
        <a href="/blog/rss.xml" class="rss-link" style="display: inline-flex; align-items: center; font-size: 0.9rem; color: var(--faint); text-decoration: none; transition: color 0.2s;">
          <svg class="rss-icon" viewBox="0 0 24 24" width="16" height="16" fill="none" stroke="#f26522" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round" style="margin-right: 6px; transition: transform 0.3s cubic-bezier(0.175, 0.885, 0.32, 1.275);"><path d="M4 11a9 9 0 0 1 9 9"></path><path d="M4 4a16 16 0 0 1 16 16"></path><circle cx="5" cy="19" r="1"></circle></svg>
          RSS Feed
        </a>
      </div>
    </section>

    <section class="section reveal">
      <h2><span class="section-num">01</span>Latest Posts</h2>
      {{posts}}
    </section>
  </main>

  <footer class="site-foot">
    <div class="foot-row">
      <p>&copy; <span id="year">2026</span> Edoardo Dusi. No rights reserved.</p>
      <a id="contact-link" data-u="hello" data-d="edoardodusi.com" href="#">Get in touch</a>
    </div>
  </footer>

  <script src="/main.js?v2" defer></script>
  <script>
    (function () {
      const title = document.querySelector('.hero h1');
      if (!title) return;

      // Exact accent colors per theme + orange target
      const DARK_TEAL  = { h: 177, s: 59, l: 57 }; // #4fd1c5
      const LIGHT_TEAL = { h: 174, s: 78, l: 27 }; // #0f766e
      const ORANGE     = { h: 22,  s: 90, l: 55 }; // ~#f26522

      let angle       = 135;
      let targetAngle = 135;
      let blend       = 0;   // 0 = solid teal, 1 = full orange gradient
      let targetBlend = 0;
      let rafId       = null;
      let isHovering  = false;

      const isDark = () => document.documentElement.dataset.theme === 'dark';

      function lerp(a, b, t) { return a + (b - a) * t; }

      function revertToCSS() {
        title.style.backgroundImage     = '';
        title.style.webkitBackgroundClip = '';
        title.style.backgroundClip      = '';
        title.style.webkitTextFillColor  = '';
      }

      function apply() {
        const TEAL = isDark() ? DARK_TEAL : LIGHT_TEAL;
        const h2 = lerp(TEAL.h, ORANGE.h, blend);
        const s2 = lerp(TEAL.s, ORANGE.s, blend);
        const l2 = lerp(TEAL.l, ORANGE.l, blend);
        const grad = `linear-gradient(${angle.toFixed(1)}deg,` +
          `hsl(${TEAL.h},${TEAL.s}%,${TEAL.l}%) 0%,` +
          `hsl(${h2.toFixed(0)},${s2.toFixed(0)}%,${l2.toFixed(0)}%) 100%)`;
        title.style.backgroundImage      = grad;
        title.style.webkitBackgroundClip = 'text';
        title.style.backgroundClip       = 'text';
        title.style.webkitTextFillColor  = 'transparent';
      }

      function tick() {
        angle = lerp(angle, targetAngle, 0.07);
        blend = lerp(blend, targetBlend, 0.05);

        apply();

        const done = Math.abs(angle - targetAngle) < 0.05 &&
                     Math.abs(blend - targetBlend) < 0.002;

        if (!done || isHovering) {
          rafId = requestAnimationFrame(tick);
        } else {
          angle = targetAngle;
          blend = targetBlend;
          rafId = null;
          // In light mode, once fully settled at blend=0, hand back to CSS
          if (!isDark() && targetBlend === 0) {
            revertToCSS();
          } else {
            apply();
          }
        }
      }

      function startTick() {
        if (!rafId) rafId = requestAnimationFrame(tick);
      }

      // Dark mode: take over immediately (gradient always visible)
      // Light mode: leave CSS in charge until hover
      if (isDark()) {
        blend = 1; targetBlend = 1;
        apply();
      }

      // Watch for theme toggle
      const observer = new MutationObserver(() => {
        if (isDark()) {
          targetBlend = 1;
          startTick();
        } else {
          targetBlend = isHovering ? 1 : 0;
          if (!isHovering) {
            // Animate out then revert
            startTick();
          }
        }
      });
      observer.observe(document.documentElement, { attributes: true, attributeFilter: ['data-theme'] });

      title.addEventListener('mousemove', (e) => {
        if (!isHovering) {
          // First frame of hover: sync angle & blend start for smooth entry
          isHovering = true;
          blend = 0;
        }
        targetBlend = 1;
        const rect = title.getBoundingClientRect();
        const x = (e.clientX - rect.left) / rect.width  - 0.5;
        const y = (e.clientY - rect.top)  / rect.height - 0.5;
        targetAngle = Math.atan2(y, x) * (180 / Math.PI) + 90;
        angle = targetAngle; // snap angle, only blend smoothly
        startTick();
      });

      title.addEventListener('mouseleave', () => {
        isHovering  = false;
        targetAngle = 135;
        targetBlend = isDark() ? 1 : 0;
        startTick();
      });
    })();
  </script>
</body>
</html>
